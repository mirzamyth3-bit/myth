<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login</title>
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="border: 1px solid #ccc; padding: 20px; border-radius: 5px;" width="300px;">
        <h2>Login</h2>
        <form>
            <label>Email:</label>
            <input type="email" required style="width: 100%; margin-bottom:10px; padding: 5px; "><br>
            <label>Password:</label><br>
            <input type="password" required style="width: 100%; margin-bottom:15px; padding: 5px;"><br>
            <button type="submit" style="width: 100%; padding: 8px;">Log In</button>
        </form>
    </div>
</body>
</html>
